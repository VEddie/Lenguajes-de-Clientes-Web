<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Matrix Solver</title>
</head>
<body>
    <div class="container">
        <div class="inputs">
            <p>A [3x3]</p>
            <div id="matrix_a" class="matrix">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
            </div>

            <div class="change_operations">
                <button id="increase">+</button>
                <button id="decrease">-</button>
                <button id="swap">A⇄B</button>
                <button id="randomValues">Fill</button>
                <button id="clear">Clear</button>
            </div>
            
            <p>B [3x3]</p>
            <div id="matrix_b" class="matrix">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
                <input type="number" value="0">
            </div>
        </div>

        <div class="math_operations">
            <button id="sum">Sum</button>
            <button id="subtract">Subtract</button>
            <button id="multiply">Multiply</button>
            <div>
                <button id="multiplyBy">Multiply A by</button>
                <input id="multiplyValue" type="number" value="0">
            </div>
            <button id="transpose">Transpose</button>
            <button id="determinant">Determinant</button>
            <button id="inverse">Inverse</button>
            <button id="identity">Identity</button>
        </div>

        <div class="results"></div>
    </div>
    <script type="module" src="./js/script.js"></script>
    <script type="module" src="./js/matrix.js"></script>
</body>
</html>
